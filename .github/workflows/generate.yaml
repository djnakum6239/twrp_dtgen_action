name: Production TWRP Tree Engine & Pusher

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct download URL to boot.img, vendor_boot.img, or recovery.img'
        required: true
        type: string
      device_brand:
        description: 'Device OEM Brand (e.g., oppo, realme, oneplus)'
        required: true
        default: 'oppo'
        type: string
      device_codename:
        description: 'Device Codename (e.g., findx6, cph2523)'
        required: true
        default: 'unknown'
        type: string
      github_username:
        description: 'Your GitHub Username/Organization'
        required: true
        type: string
      target_repo:
        description: 'Target Repository Name (e.g., android_device_oppo_findx6)'
        required: true
        type: string
      target_branch:
        description: 'Branch to push to (e.g., twrp-14, main)'
        required: true
        default: 'main'
        type: string

jobs:
  generate-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Generator Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Extraction Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl coreutils zip unzip git cpio
          mkdir -p $HOME/.local/bin
          curl -sL "https://github.com" -o $HOME/.local/bin/magiskboot
          chmod +x $HOME/.local/bin/magiskboot
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download Target Image
        run: |
          echo "[+] Downloading target partition image from: ${{ github.event.inputs.image_url }}"
          curl -L "${{ github.event.inputs.image_url }}" -o target_image.img
          if [ ! -s target_image.img ]; then
            echo "[-] Error: Downloaded file is empty or link is broken."
            exit 1
          fi

      - name: Execute Framework Generation Pipeline
        shell: python
        run: |
          import os
          import re
          import subprocess
          import shutil
          import sys

          brand = "${{ github.event.inputs.device_brand }}".lower()
          codename = "${{ github.event.inputs.device_codename }}".lower()
          image_path = "target_image.img"
          output_dir = f"output_tree/device/{brand}/{codename}"
          props = {'cmdline': "bootdevice=soc/11120000.msdc loop.max_part=7", 'pagesize': "4096"}

          print(f"[+] Extracting {image_path} via magiskboot...")
          os.makedirs("work_dir", exist_ok=True)
          shutil.copy(image_path, "work_dir/boot.img")
          subprocess.run(["magiskboot", "unpack", "boot.img"], cwd="work_dir")

          header_file = "work_dir/header"
          if os.path.exists(header_file):
              with open(header_file, "r", errors='ignore') as f:
                  content = f.read()
              cmdline_match = re.search(r'cmdline=(.*)', content)
              pagesize_match = re.search(r'page_size=(.*)', content)
              if cmdline_match: props['cmdline'] = cmdline_match.group(1).strip()
              if pagesize_match: props['pagesize'] = pagesize_match.group(1).strip()

          os.makedirs(output_dir, exist_ok=True)
          os.makedirs(f"{output_dir}/recovery/root/vendor/firmware", exist_ok=True)
          os.makedirs(f"{output_dir}/recovery/root/lib/modules", exist_ok=True)

          if os.path.exists("work_dir/ramdisk.cpio"):
              print("[+] Deep unpacking ramdisk filesystem to extract operational driver files...")
              subprocess.run("magiskboot cpio unpack ramdisk.cpio", shell=True, cwd="work_dir", stdout=subprocess.DEVNULL)
              for root, dirs, files in os.walk("work_dir"):
                  for file in files:
                      if "fstab" in file:
                          shutil.copy(os.path.join(root, file), f"{output_dir}/recovery.fstab")
                      if file.endswith(".ko"):
                          shutil.copy(os.path.join(root, file), f"{output_dir}/recovery/root/lib/modules/{file}")
                      if file in ["prop.default", "default.prop"]:
                          shutil.copy(os.path.join(root, file), f"{output_dir}/recovery/root/{file}")

          if os.path.exists("work_dir/kernel"):
              shutil.copy("work_dir/kernel", f"{output_dir}/kernel")
          if os.path.exists("work_dir/dtb"):
              shutil.copy("work_dir/dtb", f"{output_dir}/dtb")

          board_content = f"""# Auto-generated TWRP Build Environment Tree
          DEVICE_PATH := device/{brand}/{codename}

          # Architecture Configs
          TARGET_ARCH := arm64
          TARGET_ARCH_VARIANT := armv8-a
          TARGET_CPU_ABI := arm64-v8a
          TARGET_2ND_ARCH := arm
          TARGET_2ND_ARCH_VARIANT := armv7-a-neon
          TARGET_2ND_CPU_ABI := armeabi-v7a

          # Kernel Context Configuration (Parsed from Stock Header)
          BOARD_KERNEL_CMDLINE := {props.get('cmdline', '')}
          BOARD_KERNEL_PAGESIZE := {props.get('pagesize', '4096')}
          BOARD_BOOT_HEADER_VERSION := 4
          BOARD_HAS_LARGE_FILESYSTEM := true

          # Extracted Prebuilt Binaries Assignments
          TARGET_PREBUILT_KERNEL := $(DEVICE_PATH)/kernel
          TARGET_PREBUILT_DTB := $(DEVICE_PATH)/dtb

          # Dynamic System Linking Flags (Android 13-17 Compilable)
          TARGET_BOARD_PLATFORM := gki
          BOARD_USES_RECOVERY_AS_BOOT := true
          TARGET_NO_RECOVERY := false
          BOARD_BUILD_SYSTEM_ROOT_IMAGE := false

          # TWRP Custom Build Engine Switches
          TW_THEME := portrait_hdpi
          TW_EXTRA_LANGUAGES := true
          TW_INCLUDE_CRYPTO := true
          TW_INCLUDE_FBE := true
          RECOVERY_SDCARD_ON_DATA := true
          TW_EXCLUDE_APEX := true
          TW_INCLUDE_RESETPROP := true
          TW_INCLUDE_LIBRESETPROP := true

          # Load harvested touch / hardware driver components during boot sequence
          TW_LOAD_VENDOR_MODULES := true
          """
          board_content = "\n".join([line.strip() for line in board_content.splitlines() if line.strip()])
          with open(f"{output_dir}/BoardConfig.mk", "w") as f: f.write(board_content + "\n")

          with open(f"{output_dir}/AndroidProducts.mk", "w") as f:
              f.write(f"PRODUCT_MAKEFILES := $(LOCAL_DIR)/omni_{codename}.mk\n")

          blueprint_content = "// Auto-generated build scoping structure\nsoong_namespace {\n}\n"
          with open(f"{output_dir}/Android.bp", "w") as f: f.write(blueprint_content)

          omni_content = f"""$(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/twres_common.mk)
          $(call inherit-product, device/{brand}/{codename}/device.mk)

          PRODUCT_DEVICE := {codename}
          PRODUCT_NAME := omni_{codename}
          PRODUCT_BRAND := {brand.upper()}
          PRODUCT_MODEL := {codename.upper()}
          PRODUCT_MANUFACTURER := {brand}

          PRODUCT_RELEASE_NAME := {codename}
          """
          omni_content = "\n".join([line.strip() for line in omni_content.splitlines() if line.strip()])
          with open(f"{output_dir}/omni_{codename}.mk", "w") as f: f.write(omni_content + "\n")

          device_content = """# Enable Virtual A/B properties natively
          $(call inherit-product, $(SRC_TARGET_DIR)/product/virtual_ab_ota.mk)

          PRODUCT_RECOVERY_DEPENDENCIES += \
              libcrypto \
              libresetprop

          PRODUCT_STATIC_BOOT_CONTROL_HAL := true
          """
          device_content = "\n".join([line.strip() for line in device_content.splitlines() if line.strip()])
          with open(f"{output_dir}/device.mk", "w") as f: f.write(device_content + "\n")
          print("[+] Structural compilation layout ready for AOSP mapping.")

      - name: Clone and Sync to Target GitHub Repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.event.inputs.github_username }}/${{ github.event.inputs.target_repo }}.git"
          echo "[+] Pulling target tree synchronization directory..."
          git clone $REPO_URL target_repo_dir || mkdir target_repo_dir
          
          cd target_repo_dir
          if [ ! -d ".git" ]; then
            git init
            git checkout -b ${{ github.event.inputs.target_branch }}
          else
            git checkout ${{ github.event.inputs.target_branch }} || git checkout -b ${{ github.event.inputs.target_branch }}
          fi
          
          mkdir -p device
          cp -r ../output_tree/* .
          
          git add .
          if git diff-index --quiet HEAD --; then
            echo "[!] Code trees match perfectly. No updates required."
          else
            git commit -m "Merged direct-compile AOSP architecture dependencies for ${{ github.event.inputs.device_codename }} [Skip CI]"
            git push $REPO_URL ${{ github.event.inputs.target_branch }} --force
            echo "[+] Successfully synchronized out build dependencies to GitHub repository!"
          fi
          
